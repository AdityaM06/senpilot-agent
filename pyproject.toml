[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "senpilot-agent"
version = "0.1.0"
description = "Email-driven retrieval of Nova Scotia regulatory filings"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.55,<2",
  "pydantic>=2.11,<3",
  "python-dotenv>=1,<2",
  "openai>=2,<3",
  "google-api-python-client>=2,<3",
  "google-auth-oauthlib>=1,<2",
  "google-cloud-pubsub>=2,<3",
  "google-genai>=1.75,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
eval = ["anthropic>=0.69,<1"]

[project.scripts]
senpilot-agent = "senpilot_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicitly enabled checks against the public document database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
